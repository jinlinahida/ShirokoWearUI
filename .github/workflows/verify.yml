name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, coverage gate and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Xmx3g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # The gate is the contract from AGENTS.md: deterministic design logic stays
      # covered. Neither publication path can bypass it.
      - name: Unit tests and coverage verification
        run: >-
          ./gradlew --no-daemon
          :shirokowear:testDebugUnitTest
          :shirokowear-navigation:testDebugUnitTest
          :shirokowear:koverVerify
          :shirokowear-navigation:koverVerify

      - name: Build library AARs and gallery APK
        run: >-
          ./gradlew --no-daemon
          :shirokowear:assembleRelease
          :shirokowear-navigation:assembleRelease
          :sample:assembleDebug

      - name: Upload gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AARs
        uses: actions/upload-artifact@v4
        with:
          name: aar
          path: '*/build/outputs/aar/*.aar'
          if-no-files-found: error
