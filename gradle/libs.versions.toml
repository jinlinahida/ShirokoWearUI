[versions]
agp = "8.7.3"
kotlin = "2.0.21"
compose = "1.9.0"
wearCompose = "1.6.2"
activityCompose = "1.10.0"
graphicsShapes = "1.0.1"
junit = "4.13.2"
# Matches the coroutines version Compose 1.9.0 already resolves; a newer test
# artifact would silently raise the version for consuming apps through the
# composite build.
kotlinxCoroutinesTest = "1.9.0"
androidxTestJunit = "1.2.1"
# 0.37.x requires AGP >= 8.13; 0.30.0 is the last line that pairs with the
# AGP 8.7.3 toolchain the consuming apps are on.
vanniktechMavenPublish = "0.30.0"
kover = "0.9.11"

# Release line published to Maven Central.
version = "0.1.0-alpha01"
# Used for publishToMavenLocal and CI snapshots, so local iteration never
# collides with an immutable Central version.
mavenLocalVersion = "0.1.0-SNAPSHOT"

[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }
junit = { module = "junit:junit", version.ref = "junit" }
# Pinned to the coroutines version Compose 1.9.0 already resolves (1.9.0) so a
# test-only dependency cannot bump the runtime for consuming apps.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
