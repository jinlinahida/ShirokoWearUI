name: Publish snapshot to GitHub Packages

# Snapshots are the trial lane for consuming apps: they can be overwritten, so a
# half-finished component can be validated on a real watch without burning an
# immutable Maven Central version number.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish SNAPSHOT line
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # `-PsnapshotPublication=true` switches the version to the SNAPSHOT line and
      # registers the GitHubPackages repository (see root build.gradle.kts).
      # Task name is vanniktech 0.30.0 specific: newer plugin lines rename it to
      # `publishToMavenCentral` / add a snapshot repo.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon -PsnapshotPublication=true
          :shirokowear:publishAllPublicationsToGitHubPackagesRepository
          :shirokowear-navigation:publishAllPublicationsToGitHubPackagesRepository
