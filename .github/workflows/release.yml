name: Release to Maven Central

# Central artefacts are immutable: once a version exists it can never be replaced.
# Triggered by an explicit tag, or manually for a retry after fixing a secret (a
# failed release does not consume the version). Per AGENTS.md the bar differs by
# pre-release level: `-alphaNN` / `-betaNN` may ship on a green CI alone (that is
# how a component gets tested on a real watch), while an unsuffixed `x.y.z` requires
# a consuming app to have validated it on the source track and on named hardware.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          发布版本号；留空则用 gradle/libs.versions.toml 的 version。
          tag 触发时自动取 tag 名（去掉 v 前缀）。
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish and release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # `publishAndReleaseToMavenCentral` uploads, validates and releases in one
      # shot (vanniktech 0.30.0 task name; newer lines call it
      # `publishToMavenCentral` + `mavenCentralAutomaticPublishing`).
      # Configuration cache is disabled because the plugin cannot use it here.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Version resolution order: explicit dispatch input > tag name > catalog
          # `version`. A dispatch run on a branch must never fall back to
          # GITHUB_REF_NAME, or it would try to publish a version literally
          # named "main".
          VERSION=""
          if [ -n "$INPUT_VERSION" ]; then
            # Whitelist the token shape: the input is interpolated as a single
            # Gradle property, never as extra CLI arguments.
            case "$INPUT_VERSION" in
              *[!0-9A-Za-z.-]*)
                echo "::error::invalid version token: $INPUT_VERSION" >&2
                exit 2
                ;;
            esac
            VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          ARGS=(--no-daemon --no-configuration-cache)
          if [ -n "$VERSION" ]; then
            ARGS+=("-PpublicationVersion=$VERSION")
            echo "publishing version: $VERSION"
          else
            echo "publishing version taken from gradle/libs.versions.toml"
          fi
          ./gradlew "${ARGS[@]}" publishAndReleaseToMavenCentral
